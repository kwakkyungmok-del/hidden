<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마지막 한마디</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --bg-raised: #17171a;
    --text: #ece7de;
    --text-dim: #8c887f;
    --accent: #c08a4e;
    --accent-dim: #6b5537;
    --line: #2a2a2d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 40px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
  }
  .title {
    font-family: 'Source Serif 4', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 48px;
    max-width: 46ch;
  }

  .card {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 40px 36px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .entry-text {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: keep-all;
  }
  .entry-empty {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: var(--text-dim);
    font-style: italic;
  }
  .entry-meta {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .report-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 0.15s;
  }
  .report-btn:hover { text-decoration-color: var(--text-dim); }
  .report-btn:disabled { cursor: default; color: var(--accent-dim); }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 20px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .btn:hover { border-color: var(--text-dim); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #17130c;
    font-weight: 500;
  }
  .btn-primary:hover { background: #cd9a5e; border-color: #cd9a5e; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 56px 0 32px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  textarea {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 18px;
    resize: vertical;
    min-height: 120px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  textarea::placeholder { color: var(--text-dim); }

  .compose-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .char-count {
    font-size: 12px;
    color: var(--text-dim);
  }
  .status {
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
  }
  .status.ok { color: var(--accent); }
  .status.err { color: #c0684e; }

  @media (max-width: 480px) {
    .card { padding: 28px 22px; }
    body { padding: 40px 18px 32px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">마지막 한마디</h1>
  <p class="subtitle">아무도 모르게, 언젠가 하고 싶었던 말을 남겨보세요. 그리고 누군가 남긴 말을 하나 읽어보세요.</p>

  <div class="card" id="entryCard">
    <div class="entry-empty" id="entryText">불러오는 중...</div>
    <div class="entry-meta" id="entryMeta" style="visibility:hidden;">
      <span id="entryDate"></span>
      <button class="report-btn" id="reportBtn">신고하기</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="nextBtn">다른 글 읽기</button>
  </div>

  <div class="divider">나의 한마디 남기기</div>

  <textarea id="composeText" placeholder="누구에게도 하지 못했던 말..." maxlength="2000"></textarea>
  <div class="compose-footer">
    <span class="char-count" id="charCount">0 / 2000</span>
    <button class="btn btn-primary" id="submitBtn">남기기</button>
  </div>
  <div class="status" id="composeStatus"></div>
</div>

<script>
const SUPABASE_URL = 'https://ybmphplibinyqxlgnfsb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VNyFTj47fslOb4ZWbYAmOg_6ZhhGVyO';

const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

const entryText = document.getElementById('entryText');
const entryMeta = document.getElementById('entryMeta');
const entryDate = document.getElementById('entryDate');
const entryCard = document.getElementById('entryCard');
const nextBtn = document.getElementById('nextBtn');
const reportBtn = document.getElementById('reportBtn');
const composeText = document.getElementById('composeText');
const charCount = document.getElementById('charCount');
const submitBtn = document.getElementById('submitBtn');
const composeStatus = document.getElementById('composeStatus');

let currentEntryId = null;

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}

async function loadRandomEntry() {
  entryText.className = 'entry-empty';
  entryText.textContent = '불러오는 중...';
  entryMeta.style.visibility = 'hidden';
  nextBtn.disabled = true;
  reportBtn.disabled = false;
  reportBtn.textContent = '신고하기';

  try {
    // pull a small random-ish batch, then pick one client-side
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/entries?is_hidden=eq.false&select=id,content,created_at&order=created_at.desc&limit=50`,
      { headers }
    );
    if (!res.ok) throw new Error('fetch failed');
    const rows = await res.json();

    if (!rows.length) {
      entryText.className = 'entry-empty';
      entryText.textContent = '아직 아무도 글을 남기지 않았어요. 첫 번째 글을 남겨보시겠어요?';
      nextBtn.disabled = false;
      return;
    }

    const pick = rows[Math.floor(Math.random() * rows.length)];
    currentEntryId = pick.id;
    entryText.className = 'entry-text';
    entryText.textContent = pick.content;
    entryDate.textContent = formatDate(pick.created_at);
    entryMeta.style.visibility = 'visible';
  } catch (e) {
    entryText.className = 'entry-empty';
    entryText.textContent = '글을 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
  } finally {
    nextBtn.disabled = false;
  }
}

nextBtn.addEventListener('click', loadRandomEntry);

reportBtn.addEventListener('click', async () => {
  if (!currentEntryId || reportBtn.disabled) return;
  reportBtn.disabled = true;
  reportBtn.textContent = '신고 완료';
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/reports`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ entry_id: currentEntryId, reason: 'user_reported' })
    });
  } catch (e) {
    // silent fail is fine here; report is best-effort
  }
});

composeText.addEventListener('input', () => {
  charCount.textContent = `${composeText.value.length} / 2000`;
});

submitBtn.addEventListener('click', async () => {
  const content = composeText.value.trim();
  composeStatus.textContent = '';
  composeStatus.className = 'status';

  if (!content) {
    composeStatus.textContent = '내용을 입력해주세요.';
    composeStatus.className = 'status err';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '남기는 중...';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/entries`, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ content })
    });
    if (!res.ok) throw new Error('insert failed');

    composeText.value = '';
    charCount.textContent = '0 / 2000';
    composeStatus.textContent = '남겼습니다. 이제 이 마음은 누군가에게 닿을 거예요.';
    composeStatus.className = 'status ok';
  } catch (e) {
    composeStatus.textContent = '저장하지 못했어요. 잠시 후 다시 시도해주세요.';
    composeStatus.className = 'status err';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '남기기';
  }
});

loadRandomEntry();
</script>
</body>
</html>
